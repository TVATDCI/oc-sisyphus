# ci.yml — Sisyphus system CI
#
# Two jobs:
#   test   — runs on every push / PR / manual dispatch. Fast feedback.
#   canary — runs only on nightly cron (3am UTC) and manual dispatch.
#            Catches upstream `@opencode-ai/plugin` and `oh-my-openagent`
#            version drift that could break the plugin.
#
# Run locally with `act` if you want to test workflow changes without pushing.
#
# Node matrix: intentionally Node 22 only. This is a personal config
# that runs on Node 22. If you ever need to support more, change
# the matrix block in the `test` job.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly 3am UTC — catches upstream drift before the user discovers it
    - cron: '0 3 * * *'

# Cancel in-progress runs of the same workflow on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Tier 1 (always) + Tier 2 (push) — runs on every push
  # ─────────────────────────────────────────────────────────────────
  test:
    name: test (Tier 1 + Tier 2)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: plugins/sisyphus-gates/package-lock.json

      # ── Tier 1: ~1s — "did I break anything" ────────────────────

      - name: Tier 1.1 — plugin unit tests
        working-directory: plugins/sisyphus-gates
        run: npm ci && npm test

      - name: Tier 1.2 — plugin self-test
        working-directory: plugins/sisyphus-gates
        run: npm run self-test

      - name: Tier 1.3 — plugin compat check
        run: node scripts/verify-plugin-compat.js

      - name: Tier 1.4 — JSON syntax (opencode configs)
        run: |
          for f in opencode.json tui.json package.json \
                   plugins/sisyphus-gates/package.json; do
            if [ -f "$f" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
                && echo "OK: $f" || (echo "FAIL: $f" && exit 1)
            fi
          done

      - name: Tier 1.5 — workflow.yaml parse
        run: |
          if [ -f "$HOME/.sisyphus/workflow.yaml" ]; then
            # workflow.yaml is in $HOME/.sisyphus, not the repo, so this
            # is informational only. Plugin handles missing file via fail-closed.
            echo "INFO: ~/.sisyphus/workflow.yaml is not in the repo (expected)"
            echo "      plugin fail-closes if missing — see THREAT-MODEL.md §7"
          else
            echo "INFO: ~/.sisyphus/workflow.yaml not present in CI (expected)"
          fi

      # ── Tier 2: ~10s — "is the surrounding config healthy" ─────

      - name: Tier 2.1 — skill schema validation
        run: |
          if python3 -c "import yaml" 2>/dev/null; then
            python3 scripts/validate-skills-v2.py --all
          else
            echo "WARN: PyYAML not installed, skipping skill validation"
            pip install --quiet pyyaml && python3 scripts/validate-skills-v2.py --all
          fi

      - name: Tier 2.2 — workflow contract drift check
        run: bash scripts/check-workflow-contract.sh

      - name: Tier 2.3 — node --check on custom scripts
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || status=1
          done < <(find scripts plugins -name "*.js" -not -path "*/node_modules/*" -not -path "*/dist/*")
          exit $status

      - name: Tier 2.4 — structural integrity (agent drift check)
        run: |
          # Agent count: config is user-local (~/.omo/omo.jsonc since 4.19.4), skip on CI
          if [ -f "$HOME/.omo/omo.jsonc" ]; then
            AGENTS_JSON=$(node scripts/omo-query.js agents)
            echo "agents in config: $AGENTS_JSON"
            [ "$AGENTS_JSON" -ge 17 ] || (echo "FAIL: expected ≥17 agents, got $AGENTS_JSON" && exit 1)
          else
            echo "INFO: ~/.omo/omo.jsonc not present in CI — skipping agent count check (config is user-local since 4.19.4 migration)"
          fi

          MODEL_LINES=$(grep -c "^model:" agents/*.md 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
          echo "model: lines in agents/*.md: $MODEL_LINES"
          [ "$MODEL_LINES" -eq 0 ] || (echo "FAIL: agents/*.md should not have model: (Wave 2 cleanup)" && exit 1)

      - name: Tier 2.5 — markdown link check (root docs)
        run: |
          # Lightweight check: extract relative markdown links, verify targets exist
          status=0
          for md in COMPLETE-CODEBASE.md SYSTEM-OVERVIEW.md AGENTS.md \
                    plugins/sisyphus-gates/THREAT-MODEL.md; do
            [ -f "$md" ] || continue
            while IFS= read -r link; do
              # Skip http/https and anchors
              case "$link" in
                http*|\#*) continue ;;
              esac
              # Resolve relative to the markdown file's dir
              dir=$(dirname "$md")
              target="$dir/$link"
              target="${target%#*}"   # strip anchor
              if [ ! -e "$target" ] && [ ! -e "${target%/}.md" ]; then
                echo "BROKEN LINK in $md: $link"
                status=1
              fi
            done < <(grep -oE '\]\([^)]+\.md[^)]*\)' "$md" | sed 's/^](\(.*\))$/\1/' || true)
          done
          [ $status -eq 0 ] && echo "OK: all markdown links resolve"

      - name: Tier 2.6 — doc-claims drift check
        run: |
          if [ -f "$HOME/.omo/omo.jsonc" ]; then
            bash scripts/check-doc-claims.sh
          else
            echo "INFO: ~/.omo/omo.jsonc not present in CI — skipping doc-claims drift check (config is user-local since 4.19.4 migration)"
          fi

      # ── Artifacts: test reports + logs ──────────────────────────

      - name: generate JUnit XML (unit tests)
        if: always()
        working-directory: plugins/sisyphus-gates
        run: |
          set -o pipefail
          node --test \
               --test-reporter=junit \
               --test-reporter-destination=test-results-unit.xml \
               test/*.test.js 2>&1 | tail -20

      - name: upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            plugins/sisyphus-gates/test-results-unit.xml
            plugins/sisyphus-gates/test-results-self.log
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────
  # Tier 3: nightly canary — upstream drift detection
  # ─────────────────────────────────────────────────────────────────
  canary:
    name: canary (upstream drift)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on schedule (nightly) or manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: canary 1 — oh-my-openagent drift
        run: |
          PINNED="4.19.4"
          LATEST=$(npm view oh-my-openagent@latest version 2>/dev/null || echo "FETCH_FAILED")
          echo "pinned:  oh-my-openagent@$PINNED"
          echo "latest:  oh-my-openagent@$LATEST"
          if [ "$LATEST" = "FETCH_FAILED" ]; then
            echo "::warning::could not fetch latest oh-my-openagent version (offline?)"
          elif [ "$LATEST" != "$PINNED" ]; then
            echo "::warning::oh-my-openagent@$LATEST is available (pinned: $PINNED). Review release notes before bumping."
          else
            echo "OK: oh-my-openagent is up-to-date with pin"
          fi

      - name: canary 2 — @opencode-ai/plugin drift
        run: |
          # Read the pinned version from the plugin's package.json
          PINNED=$(node -e "
            const j = JSON.parse(require('fs').readFileSync('plugins/sisyphus-gates/package.json','utf8'));
            console.log(j.dependencies['@opencode-ai/plugin'] || 'NOT_PINNED');
          ")
          LATEST=$(npm view @opencode-ai/plugin@latest version 2>/dev/null || echo "FETCH_FAILED")
          echo "pinned:  @opencode-ai/plugin@$PINNED"
          echo "latest:  @opencode-ai/plugin@$LATEST"
          if [ "$LATEST" = "FETCH_FAILED" ]; then
            echo "::warning::could not fetch latest @opencode-ai/plugin version (offline?)"
          elif [ "$LATEST" != "$PINNED" ]; then
            echo "::warning::@opencode-ai/plugin@$LATEST is available (pinned: $PINNED). Plugin hook signatures may have changed — review changelog and run unit tests against it."
          else
            echo "OK: @opencode-ai/plugin is up-to-date with pin"
          fi

      - name: canary 3 — load latest oh-my-openagent in sandbox
        run: |
          # Real canary: does the plugin still load if we install the latest upstream?
          # This is a smoke test, not a full e2e. If the plugin's server() can be
          # imported alongside the latest upstream, the API contract is intact.
          TMPDIR=$(mktemp -d)
          echo "sandbox: $TMPDIR"
          cd "$TMPDIR"
          npm init -y >/dev/null 2>&1
          npm install --silent oh-my-openagent@latest 2>&1 | tail -3
          if [ -d node_modules/oh-my-openagent ]; then
            echo "OK: oh-my-openagent@latest installed in sandbox"
            # We don't import it (we don't depend on it), but we verify it has a
            # dist/ directory which means the package is well-formed.
            [ -d node_modules/oh-my-openagent/dist ] || [ -d node_modules/oh-my-openagent/build ] \
              && echo "OK: package layout is normal" \
              || (echo "::warning::oh-my-openagent@latest has unexpected layout — inspect manually" && exit 1)
          else
            echo "::error::oh-my-openagent@latest failed to install in sandbox"
            exit 1
          fi
          rm -rf "$TMPDIR"
