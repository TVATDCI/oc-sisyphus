# Sisyphus Workflow Definition v1.0.0
#
# This file is the single source of truth for the Sisyphus workflow state machine.
# The sisyphus-gates plugin reads this to drive phase transitions, gate conditions,
# and blocking rules — instead of hardcoding them in plugin source.
#
# Schema reference: each phase has:
#   - id: unique phase name
#   - description: human-readable purpose
#   - skill: the /skill: to invoke (optional)
#   - gates: list of gates that block this phase
#   - advance_on: triggers that advance to the next phase
#   - block: tools/commands blocked during this phase
#   - prompt: system prompt suffix injected into the model context

workflow:
  name: sisyphus-7-phase
  version: "1.0.0"
  description: "Standard 7-phase Sisyphus governance workflow with Momus review gates"

  # The global state file for persistent gate tracking
  state_file: "~/.config/opencode/.sisyphus/state.json"

  # Where to scan for gate review outputs
  review_scan:
    path: ".sisyphus/notepads"
    pattern: "momus-{type}-review"
    pass_marker: "Gate Decision:** PASS"
    fail_marker: "Gate Decision:** FAIL"
    # Also accept variations found in the wild
    pass_markers_alt:
      - "Gate Decision: PASS"
    fail_markers_alt:
      - "Gate Decision: FAIL"

  # ──────────────────────────────────────────────
  # Phase Sequence
  # ──────────────────────────────────────────────
  phases:
    - id: discovery
      description: "Explore the problem space freely. No write restrictions."
      skill: discovery-orchestrator
      output_type: brief
      gates: []
      advance_on:
        - type: skill_invocation
          skill: prd-writer
        - type: manual
          trigger: user_approves_brief
      block:
        tools: []
        commands: []
      prompt: "→ You are in discovery phase. Explore the problem space freely.\n→ When ready, invoke /skill:prd-writer to begin PRD creation."

    - id: prd-writing
      description: "Write the Product Requirements Document from the approved brief."
      skill: prd-writer
      output_type: prd
      artifacts:
        - path: ".sisyphus/prds/{plan-name}-prd.md"
          type: prd
      gates: []
      advance_on:
        - type: file_write
          match:
            path_contains: "prd"
            # Matches: any file path containing "prd" (case-insensitive via plugin)
          description: "Writing a PRD file advances from prd-writing to prd-review"
        - type: manual
          trigger: user_marks_prd_complete
      block:
        tools: []
        commands: []
      prompt: "→ Write the PRD following the approved brief.\n→ When PRD is complete, invoke /skill:momus-prd-reviewer for gate review."

    - id: prd-review
      description: "PRD review gate. Do NOT modify the PRD during review."
      gate_type: momus-review
      skill: momus-prd-reviewer
      output_type: review_report
      gates:
        - id: momus-prd
          type: momus-reviewer
          artifact_pattern: ".sisyphus/notepads/*/momus-prd-review*"
          pass_condition: 'output contains "Gate Decision: PASS"'
          fail_condition: 'output contains "Gate Decision: FAIL"'
          blocked_message: "Cannot proceed to issue-creation until PRD review passes"
      advance_on:
        - type: gate_passed
          gate: momus-prd
          gate_output_contains: "PRD review PASS"
          description: "PRD review PASS → advance to issue-creation, set prdGate=PASS"
          set_state:
            prd_gate: "PASS"
            prd_approved: true
      block:
        tools:
          - write
          - edit
        commands:
          - git commit
          - git push
        exceptions:
          - tool: bash
            when: command is NOT destructive
      prompt: "→ PRD review gate active. Do NOT modify the PRD.\n→ If review passes, mark PRD as approved and advance to issue-creation."

    - id: issue-creation
      description: "Create vertical slice issues from the approved PRD."
      skill: issue-creator
      output_type: issues
      gates: []
      advance_on:
        - type: file_write
          match:
            path_contains: "plan"
          description: "Writing a plan file advances from issue-creation to plan-review"
        - type: manual
          trigger: user_approves_issues
      block: []
      prompt: "→ Create vertical slice issues from the approved PRD.\n→ When issues are ready, invoke /skill:plan-writer."

    - id: plan-writing
      description: "Write the execution plan from approved issues."
      skill: plan-writer
      output_type: plan
      artifacts:
        - path: ".sisyphus/plans/{plan-name}.md"
          type: plan
      gates: []
      advance_on:
        - type: manual
          trigger: plan_written
      block: []
      prompt: "→ Write the execution plan from approved issues.\n→ When plan is complete, invoke /skill:momus-plan-reviewer for gate review."

    - id: plan-review
      description: "Plan review gate. Do NOT modify the plan during review."
      gate_type: momus-review
      skill: momus-plan-reviewer
      output_type: review_report
      gates:
        - id: momus-plan
          type: momus-reviewer
          artifact_pattern: ".sisyphus/notepads/*/momus-plan-review*"
          pass_condition: 'output contains "Gate Decision: PASS"'
          fail_condition: 'output contains "Gate Decision: FAIL"'
          blocked_message: "Cannot proceed to execution until plan review passes"
      advance_on:
        - type: gate_passed
          gate: momus-plan
          gate_output_contains: "Plan review PASS"
          description: "Plan review PASS → advance to execution, set planGate=PASS, approval=approved"
          set_state:
            plan_gate: "PASS"
            plan_approved: true
            approval_status: "approved"
      block:
        tools:
          - write
          - edit
        commands:
          - git commit
          - git push
        exceptions:
          - tool: bash
            when: command is NOT destructive
      prompt: "→ Plan review gate active. Do NOT modify the plan.\n→ If review passes, mark plan as approved and advance to execution."

    - id: execution
      description: "Full tool access. Implement waves sequentially."
      skill: wave-executor
      output_type: implementation
      gates:
        - id: checkpoint-3
          type: momus-reviewer
          artifact_pattern: ".sisyphus/notepads/*/momus-plan-review*"
          between_waves: true
      advance_on:
        - type: manual
          trigger: user_approves_wave
      block:
        tools: []
        commands:
          - bash
        exceptions:
          - when: command is NOT destructive
      prompt: "→ Execution mode: full tool access granted.\n→ Implement waves sequentially. Run /skill:auditor after each slice.\n→ Log evidence to .sisyphus/evidence/ before marking slices complete."

    - id: validation
      description: "Verify all slices pass acceptance criteria. Run regression checks."
      skill: regression-gate
      output_type: validation_report
      gates:
        - id: regression
          type: script
          script: "~/.config/opencode/scripts/regression-gate.sh"
      advance_on:
        - type: manual
          trigger: user_confirms_validation
      block: []
      prompt: "→ Validation phase: verify all slices pass acceptance criteria.\n→ Run regression checks between waves."

    - id: close
      description: "Archive state, close beads issues, push to remote."
      skill: plan-closer
      output_type: closure
      gates:
        - id: evidence_check
          type: condition
          condition: "evidence_logged == true"
          blocked_message: "Cannot close issue until evidence is logged. Run validation first."
      advance_on:
        - type: manual
          trigger: user_confirms_close
      block:
        commands:
          - bd close
        unless:
          evidence_logged: true
      prompt: "→ Close phase: archive state, close beads issues, push to remote.\n→ Ensure all evidence is logged before closing."

  # ──────────────────────────────────────────────
  # Auto-Advance Triggers (extracted from plugin)
  # ──────────────────────────────────────────────
  # The plugin's advancePhaseIfNeeded function uses these rules:
  auto_advance:
    - from: prd-writing
      to: prd-review
      'on':
        type: file_write
        path_contains: "prd"
      case_sensitive: false

    - from: prd-review
      to: issue-creation
      'on':
        type: output_contains
        text: "PRD review PASS"
      set_state:
        prd_gate: "PASS"
        prd_approved: true
        last_checkpoint: "prd-approved"

    - from: issue-creation
      to: plan-review
      'on':
        type: file_write
        path_contains: "plan"
      case_sensitive: false

    - from: plan-review
      to: execution
      'on':
        type: output_contains
        text: "Plan review PASS"
      set_state:
        plan_gate: "PASS"
        plan_approved: true
        last_checkpoint: "plan-approved"
        approval_status: "approved"

    - from: execution
      to: execution
      type: evidence_logged
      'on':
        tool: write
        path_matches: ".sisyphus/evidence/"
      set_state:
        evidence_logged: true

  # ──────────────────────────────────────────────
  # Blocking Rules (extracted from plugin)
  # ──────────────────────────────────────────────
  # The plugin's shouldBlockTool and shouldBlockCommand functions enforce:
  blocking:
    global_rules:
      - tool: bash
        when: command matches destructive pattern
        patterns:
          - "^rm\\s"
          - "^rm\\s+-rf"
          - "^git\\s+reset\\s+--hard"
          - "^git\\s+push\\s+--force"
          - "^git\\s+clean\\s+-fd"
          - "sudo\\s+"
          - "^dd\\s+"
          - "^mkfs"
          - "^shutdown"
          - "^reboot"
        blocked_message: "Destructive commands blocked until gates pass"

    fail_closed:
      description: "When state file is missing and gates show FAIL, block ALL writes/edits/bash/commits/pushes"
      condition: "state_file_missing AND (prd_gate == FAIL OR plan_gate == FAIL)"
      blocked_message: "State file missing. Gate decisions found in review files (PRD: {prd_gate}, Plan: {plan_gate}). Run review gates before executing."

    gate_fail:
      description: "When any gate FAILs, block writes/edits/bash"
      condition: "prd_gate == FAIL OR plan_gate == FAIL"
      blocked_message: "Gate review(s) FAILED (PRD: {prd_gate}, Plan: {plan_gate}). Fix blockers and re-run review gates before executing."

    approval_mismatch:
      description: "When approval_status is neither 'approved' nor 'pending'"
      condition: "approval_status NOT IN (approved, pending)"
      blocked_message: 'approval_status is "{approval_status}". Must be "approved" to execute.'

    unapproved_plan:
      description: "PRD approved but plan not approved — block commits/pushes"
      condition: "prd_approved AND NOT plan_approved"
      block:
        commands:
          - git commit
          - git push
        tools:
          - bash
        bash_exceptions:
          - when: command does NOT contain "git commit" or "git push" and is NOT destructive
      blocked_message: "Cannot commit until plan gate passes. Run /skill:plan-writer first."

  # ──────────────────────────────────────────────
  # State Schema
  # ──────────────────────────────────────────────
  state:
    version: "2.0.0"
    persistent_fields:
      - name: project
        type: string
        description: "Project identifier (directory name or path)"
      - name: phase
        type: string
        description: "Current phase id"
      - name: prd_gate
        type: enum
        values: [unknown, PASS, FAIL]
        default: unknown
      - name: plan_gate
        type: enum
        values: [unknown, PASS, FAIL]
        default: unknown
      - name: approval_status
        type: enum
        values: [pending, approved, rejected]
        default: pending
      - name: last_updated
        type: timestamp
      - name: current_focus
        type: string
        optional: true

    session_fields:
      - name: phase
        type: string
      - name: prdApproved
        type: boolean
        default: false
      - name: planApproved
        type: boolean
        default: false
      - name: evidenceLogged
        type: boolean
        default: false
      - name: lastCheckpoint
        type: string
        default: session-start
      - name: prdGateStatus
        type: string
        default: unknown
      - name: planGateStatus
        type: string
        default: unknown
      - name: approvalStatus
        type: string
        default: pending
      - name: stateFileExists
        type: boolean
        default: false

    project_state_fields:
      - name: active_plan
        type: string
        description: "Path to the active plan file"
      - name: state_version
        type: string
        default: "2.0.0"
      - name: workflow_stage
        type: string
        description: "plan_created | wave_N_completed | execution_complete"
      - name: pending_gate
        type: string
        description: "execution_approval | wave_N+1_approval | none"
      - name: gate_history
        type: array
        items:
          gate: string
          status: string
          timestamp: string
      - name: current_wave
        type: integer
        default: 0
      - name: completed_slices
        type: array
        items: string

  # ──────────────────────────────────────────────
  # Skill Mapping
  # ──────────────────────────────────────────────
  skill_map:
    discovery: discovery-orchestrator
    prd-writing: prd-writer
    prd-review: momus-prd-reviewer
    issue-creation: issue-creator
    plan-writing: plan-writer
    plan-review: momus-plan-reviewer
    execution: wave-executor
    validation: regression-gate
    close: plan-closer

  # ──────────────────────────────────────────────
  # Compaction Protection Rules
  # ──────────────────────────────────────────────
  compaction:
    preserve_checkpoints:
      - prd-approved
      - plan-approved
      - session-start
    preserve_context:
      - "Current phase"
      - "PRD gate"
      - "Plan gate"
      - "Approval status"
      - "PRD approved"
      - "Plan approved"
